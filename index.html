<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 상품 링크 모음</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #f7f9ff 0%, #ffffff 100%);
      color: #111827;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: clamp(24px, 6vw, 34px);
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-card {
      position: relative;
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      align-items: center;
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.07);
    }

    .num {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #123bdc;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .product-img {
      width: 92px;
      height: 112px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      margin-bottom: 7px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef2ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 800;
    }

    .product-title {
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      line-height: 1.5;
      color: #4b5563;
      margin-bottom: 12px;
    }

    .cta {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 14px;
      background: #123bdc;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(18, 59, 220, 0.24);
    }

    .notice {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .product-card {
        grid-template-columns: 82px 1fr;
        gap: 13px;
        padding: 16px;
      }

      .product-img {
        width: 82px;
        height: 102px;
      }

      .product-title {
        font-size: 16px;
      }

      .desc {
        font-size: 13px;
      }

      .cta {
        width: 100%;
        text-align: center;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>추천 상품 링크 모음</h1>
      
    </header>

    <section class="product-list">

      <article class="product-card">
        <div class="num">1</div>

        <img src="product images/멜라토닝 크림 사진.png" alt="기미 잡티 검버섯 흑자 제거 멜라토닝 크림" class="product-img" />

        <div>
          <div class="badge">SPOT CARE</div>

          <h2 class="product-title">기미 잡티 검버섯 흑자 제거 멜라토닝 크림</h2>

          <p class="desc">
            칙칙한 피부톤, 잡티, 기미 고민이 있다면 상품 페이지에서 자세히 확인해보세요.
          </p>

          <a class="cta" href="https://link.coupang.com/a/e3kulkqwXk" target="_blank" rel="nofollow sponsored noopener">
            상품 보러가기
          </a>
        </div>
      </article>

      <article class="product-card">
        <div class="num">2</div>

        <img src="product images/풀무원 생수 사진.png" alt="풀무원 생수" class="product-img" />

        <div>
          <div class="badge">DAILY WATER</div>

          <h2 class="product-title">풀무원 생수</h2>

          <p class="desc">
            집, 사무실, 외출용으로 부담 없이 챙기기 좋은 생수입니다. 물을 자주 마시는 분이라면 확인해보세요.
          </p>

          <a class="cta" href="https://link.coupang.com/a/etl8zUBJPE" target="_blank" rel="nofollow sponsored noopener">
            상품 보러가기
          </a>
        </div>
      </article>

    </section>

    <p class="notice">
      이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
    </p>
  </main>
</body>
</html>
