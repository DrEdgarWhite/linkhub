<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기미 잡티 검버섯 흑자 제거 멜라토닝 크림</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #f7f9ff 0%, #ffffff 100%);
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
    }

    .product-img {
      width: min(72vw, 260px);
      max-height: 420px;
      object-fit: contain;
      margin: 8px auto 18px;
      display: block;
    }

    h1 {
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .desc {
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 22px;
    }

    .cta {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 18px;
      background: #123bdc;
      color: #ffffff;
      text-decoration: none;
      font-size: 19px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(18, 59, 220, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:active {
      transform: scale(0.98);
      box-shadow: 0 6px 16px rgba(18, 59, 220, 0.24);
    }

    .notice {
      margin-top: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: #6b7280;
    }

    @media (min-width: 768px) {
      .wrap {
        max-width: 860px;
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 34px;
        align-items: center;
        text-align: left;
        padding: 42px;
      }

      .product-img {
        width: 320px;
        margin: 0 auto;
      }

      .cta {
        max-width: 360px;
        text-align: center;
      }

      .notice {
        max-width: 430px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section>
      <img src="product.png" alt="기미 잡티 검버섯 흑자 제거 멜라토닝 크림" class="product-img" />
    </section>

    <section>
      <div class="badge">SPOT ATONING CARE</div>

      <h1>기미 잡티 검버섯 흑자 제거 멜라토닝 크림</h1>

      <p class="desc">
        칙칙한 피부톤, 잡티, 기미 고민이 있다면<br />
        지금 상품 페이지에서 자세히 확인해보세요.
      </p>

      <a class="cta" href="https://link.coupang.com/a/es2UGkf02K" target="_blank" rel="nofollow sponsored noopener">
        상품 보러가기
      </a>

      <p class="notice">
        이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
    </section>
  </main>
</body>
</html>
